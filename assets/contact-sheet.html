<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 24px; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #f4f4f5; color: #18181b; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: #52525b; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  figure { margin: 0; background: #fff; border: 1px solid #e4e4e7; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  figure.dark { background: #1c1b22; border-color: #2e2d38; color: #f4f4f5; }
  figure.dark .caption { color: #c4c4cc; }
  figure.recommended { box-shadow: 0 0 0 2px #2563eb inset; }
  .head { display: flex; align-items: baseline; gap: 10px; }
  .num { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 8px; background: #18181b; color: #fff; font-weight: 700; font-size: 16px; }
  figure.dark .num { background: #f4f4f5; color: #18181b; }
  .name { font-weight: 700; font-size: 17px; }
  .star { color: #2563eb; font-weight: 700; }
  .caption { font-size: 13px; color: #52525b; }
  .img { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 220px; }
  .img img { max-width: 100%; max-height: 320px; }
  footer { margin-top: 24px; color: #52525b; font-size: 13px; }
</style>
</head>
<body>
<h1>{{TITLE}}</h1>
<p class="lead">Same diagram, nine styles. Reply in Claude with the number you want. Starred styles are the recommended defaults.</p>
<div class="grid">
{{CARDS}}
</div>
<footer>{{FOOTER}}</footer>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { color-scheme: light dark;
    --bg:#f4f4f5; --card:#fff; --line:#e4e4e7; --ink:#18181b; --muted:#52525b; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e0e12; --card:#17171c; --line:#2a2a32; --ink:#f4f4f5; --muted:#a1a1aa; --accent:#60a5fa; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin:0; padding:32px 24px 48px; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1560px; margin:0 auto; }
  h1 { font-size:24px; letter-spacing:-0.01em; margin:0 0 6px; }
  p.lead { margin:0 0 24px; color:var(--muted); max-width:70ch; }
  /* One card per 480px of viewport: 1 column on a narrow window, 2 at ~1100px, 3 at ~1600px. */
  .grid { display:grid; gap:20px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); }
  figure { margin:0; display:flex; flex-direction:column; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 16px 18px;
    box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 28px -20px rgba(0,0,0,.35); }
  figure.dark { background:#16151b; border-color:#2e2d38; color:#f4f4f5; }
  figure.dark .caption, figure.dark .meta { color:#a5a5b0; }
  figure.dark .meta span, figure.dark .img a { border-color:#2e2d38; }
  figure.recommended { border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent), 0 10px 28px -20px rgba(0,0,0,.35); }
  .head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .num { display:inline-flex; align-items:center; justify-content:center; min-width:28px; height:28px;
    padding:0 8px; border-radius:8px; background:var(--ink); color:var(--bg);
    font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; }
  figure.dark .num { background:#f4f4f5; color:#16151b; }
  .name { font-weight:650; font-size:17px; letter-spacing:-0.01em; }
  .star { margin-left:auto; color:var(--accent); font-weight:600; font-size:13px; white-space:nowrap; }
  .caption { font-size:13.5px; color:var(--muted); }
  .meta { display:flex; gap:6px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); }
  .meta span { border:1px solid var(--line); border-radius:999px; padding:2px 8px; }
  .img { margin-top:auto; }
  .img a { display:block; overflow:hidden; border:1px solid var(--line); border-radius:8px; }
  .img img { display:block; width:100%; height:auto; }   /* fill the card, never letterbox */
  footer { margin:28px 0 0; color:var(--muted); font-size:13px; }
  @media (max-width:560px) { body { padding:20px 14px 32px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>{{TITLE}}</h1>
  <p class="lead">The same diagram in nine styles. Reply in Claude with the number you want &mdash;
  starred styles are the recommended defaults. Click a picture to open it full size.</p>
  <div class="grid">
{{CARDS}}
  </div>
  <footer>{{FOOTER}}</footer>
</div>
</body>
</html>
